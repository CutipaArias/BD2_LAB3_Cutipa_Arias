name: infra
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["infra/**"]

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  TF_VAR_atlas_public_key: ${{ secrets.ATLAS_PUBLIC_KEY }}
  TF_VAR_atlas_private_key: ${{ secrets.ATLAS_PRIVATE_KEY }}
  TF_VAR_atlas_org_id: ${{ secrets.ATLAS_ORG_ID }}
  TF_VAR_pg_password: ${{ secrets.PG_PASSWORD }}
  TF_VAR_registry_username: ${{ github.actor }}
  TF_VAR_registry_password: ${{ secrets.GHCR_TOKEN }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de imagen en minusculas
        run: echo "TF_VAR_image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform validate
      - name: Verificar secrets requeridos
        env:
          S_ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          S_ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          S_ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          S_ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          S_ATLAS_ORG_ID: ${{ secrets.ATLAS_ORG_ID }}
          S_ATLAS_PRIVATE_KEY: ${{ secrets.ATLAS_PRIVATE_KEY }}
          S_ATLAS_PUBLIC_KEY: ${{ secrets.ATLAS_PUBLIC_KEY }}
          S_GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          S_PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        working-directory: .
        run: |
          faltan=""
          for v in ${!S_@}; do if [ -z "${!v}" ]; then faltan="$faltan ${v#S_}"; fi; done
          if [ -n "$faltan" ]; then
            echo "::error title=Faltan secrets de despliegue::Configure en Settings > Secrets and variables > Actions:$faltan. Se obtienen al crear la suscripcion de Azure (ver PENDIENTES)."
            exit 1
          fi
          echo "Secrets configurados"
      - run: terraform plan -out=tfplan
      - run: terraform apply -auto-approve tfplan
